function renderQuiz(){const x=list(),q=x[state.index],key=k(q.paper,q.number),picked=state.answers[key],done=picked!=null,correct=q.answer,global=state.index+1;root.innerHTML=`<main class="quiz"><header class="quiz-header"><button class="icon" data-home>←</button><div class="qtitle"><small>${state.mode==='all'?'ALL QUIZZES':'QUIZ MODE'}</small><strong>${q.title}</strong></div><div class="counter">${global}/${x.length}</div></header><div class="top-progress"><i style="width:${global/x.length*100}%"></i></div><section class="stage"><div class="qmeta"><div><div class="qkicker">${q.title} · QUESTION ${q.number}</div><h1>Choose the correct answer</h1></div><button class="save ${state.saved.includes(key)?'on':''}" data-save>☆ Save</button></div><div class="crop-card"><img src="${q.question}" alt="${q.title} Question ${q.number}" data-zoom="${q.question}"></div><div class="answer-box"><div class="answer-head"><strong>Your answer</strong><span>Select 1–5</span></div><div class="choices">${[1,2,3,4,5].map(n=>{let c='choice';if(done){if(n===correct)c+=' correct';else if(n===picked)c+=' wrong';else c+=' dim'}return`<button class="${c}" data-choice="${n}">${n}${done&&n===correct?'<i>✓</i>':done&&n===picked&&picked!==correct?'<i>×</i>':''}</button>`}).join('')}</div>${done?`<div class="feedback ${picked===correct?'good':'bad'}"><div class="mark">${picked===correct?'✓':'!'}</div><div><strong>${picked===correct?'Correct!':'Not quite — review the marking.'}</strong><p>The official marking answer is ${correct}.</p></div></div><section class="marking"><small>OFFICIAL MARKING REVIEW</small><h2>Why this answer is right</h2><p style="margin:-6px 0 16px"><a href="${q.markingPdf}" target="_blank" rel="noopener" style="color:#4b68d0;font-weight:800;text-decoration:none">Open marking PDF ↗</a></p><img src="${q.marking}" alt="${q.title} Question ${q.number} official marking" data-zoom="${q.marking}"></section>`:''}</div><div class="nav"><button data-prev ${state.index===0?'disabled':''}>← Previous</button><span>${q.title} · ${q.number}/5</span>${state.index===x.length-1?`<button class="next" data-results>View results →</button>`:`<button class="next" data-next>Next →</button>`}</div></section></main>`;bindImages()}
function renderResults(){const x=list();let attempted=0,score=0;x.forEach(q=>{const v=state.answers[k(q.paper,q.number)];if(v!=null){attempted++;if(v===q.answer)score++}});const pct=attempted?Math.round(score/attempted*100):0;root.innerHTML=`<main class="results"><div class="result-card"><p class="eyebrow">PRACTICE RESULTS</p><h1>${state.mode==='all'?'Daily Quiz 01–17':`QUIZ ${String(state.paper).padStart(2,'0')}`}</h1><div class="score" style="--score:${pct}%"><div><strong>${pct}%</strong><span>SCORE</span></div></div><div class="result-stats"><div><span>CORRECT</span><strong>${score}</strong></div><div><span>ATTEMPTED</span><strong>${attempted}</strong></div><div><span>TOTAL</span><strong>${x.length}</strong></div></div><div class="actions" style="justify-content:center"><button class="btn primary" data-home>Back to quizzes</button><button class="btn secondary" data-retry>Review questions</button></div></div></main>`}
function bindImages(){root.querySelectorAll('img[data-zoom]').forEach(img=>{img.addEventListener('click',()=>showZoom(img.dataset.zoom));img.addEventListener('error',()=>{const b=img.parentElement;img.remove();if(b&&!b.querySelector('.asset-error'))b.insertAdjacentHTML('beforeend','<div class="feedback bad asset-error"><div class="mark">!</div><div><strong>Image load error</strong><p>Google Drive එකට sign in කරලා page එක refresh කරන්න.</p></div></div>')},{once:true})})}
function showZoom(src){state.zoom=src;modal.innerHTML=`<div class="modal open"><button data-close>×</button><img src="${src}" alt="Expanded crop"></div>`;modal.querySelector('[data-close]').onclick=closeZoom;modal.querySelector('.modal').onclick=e=>{if(e.target===e.currentTarget)closeZoom()}}
function closeZoom(){state.zoom='';modal.innerHTML=''}
function render(){state.screen==='home'?renderHome():state.screen==='quiz'?renderQuiz():renderResults();bind()}
function bind(){root.querySelectorAll('[data-paper]').forEach(b=>b.onclick=()=>startPaper(Number(b.dataset.paper)));root.querySelector('[data-all]')?.addEventListener('click',startAll);root.querySelectorAll('[data-home]').forEach(b=>b.onclick=home);root.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)));root.querySelector('[data-save]')?.addEventListener('click',toggleSave);root.querySelector('[data-prev]')?.addEventListener('click',()=>move(-1));root.querySelector('[data-next]')?.addEventListener('click',()=>move(1));root.querySelector('[data-results]')?.addEventListener('click',results);root.querySelector('[data-retry]')?.addEventListener('click',()=>{state.screen='quiz';state.index=0;render()})}
render();
</script>
</body>
</html>
